<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101010" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const theme = localStorage.getItem('kinetic-theme')
        document.documentElement.dataset.theme =
          theme === 'light' || theme === 'dark' ? theme : 'dark'
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'light' ? '#f2efe9' : '#101010')
      } catch (error) {
        console.error('Unable to read the saved theme preference.', error)
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <title>Aditya Yadav - Portfolio</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
